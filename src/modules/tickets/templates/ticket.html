    <style>
      @page {
        size: 58mm auto;
        margin: 0;
      }
      body {
        font-family: monospace;
        font-size: 28px;
        margin: 0;
        padding: 45px;
        margin: 0 auto;
        max-width: 700px;
        width: auto;
        line-height: 1.4;
      }
      .header {
        text-align: center;
      }
      .footer {
        margin-top: 10px;
        text-align: center;
      }

        width: 100%;
      }
      .category {
        margin-top: 10px;
        font-weight: bold;

      .item {
        display: flex;
        justify-content: space-between;
      }
      .item-name {
        word-wrap: break-word;
